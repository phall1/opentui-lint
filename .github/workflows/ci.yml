name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - run: bun run test

  conformance:
    # Proves every diagnostic against a real OpenTUI render in BOTH bindings,
    # and fails if the generated catalog has drifted from the published
    # packages. The two suites are separate jobs' steps because the React and
    # Solid JSX pipelines cannot share a process.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --filter opentui-lint-conformance test
      - run: bun run --filter opentui-lint-conformance-solid test
      - run: bun run --filter opentui-lint-examples-conformance test
      - run: bun run --filter opentui-lint-conformance-oxlint test
      - run: bun run catalog:check
